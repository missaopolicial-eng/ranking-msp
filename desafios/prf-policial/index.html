<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Flashcard Relâmpago PRF Policial – desafio da comunidade MSP com ranking ao vivo. 12h às 13h.">
<title>Flashcard Relâmpago PRF Policial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Krona+One&family=Montserrat:wght@600&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: mesma identidade do Ranking MSP. Arena escura de quartel, logo MSP com régua dourada, pódio com brasões, fichas em grade. */
:root{
  color-scheme:dark;
  --bg:#0c0b09; --bg2:#14120e; --card:#1a1712; --card2:#221e17; --line:#2f2a20;
  --fg:#f3ecdd; --muted:#a59a83; --dim:#6d6554;
  --gold:#d6ac4c; --gold-hi:#f4d27c; --gold-lo:#8a6a24; --on-gold:#1b1407;
  --silver:#c9cdd3; --bronze:#c4814a;
  --up:#5fcf8a; --down:#e0645a; --steel:#7ea6d9;
  --up-bg:rgba(95,207,138,.12); --down-bg:rgba(224,100,90,.12); --gold-bg:rgba(214,172,76,.08);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--gold-hi)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.01em;line-height:.95;margin:0;text-wrap:balance;font-weight:900}
h2{font-size:clamp(36px,6vw,56px)}
.gold{background:linear-gradient(180deg,#fff7e2 0%,var(--gold-hi) 45%,var(--gold) 75%,var(--gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:700}
.mut{color:var(--muted)}
.mono,.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(12,11,9,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg)}
.mini-logo{display:flex;flex-direction:column;align-items:center;gap:3px}
.mini-logo b{font-family:"Krona One","Arial Black",sans-serif;font-size:20px;line-height:1;letter-spacing:.04em;color:#fff}
.mini-logo i{display:block;width:44px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold) 25%,var(--gold-hi) 50%,var(--gold) 75%,transparent)}
.brand .bt{display:grid;gap:2px;border-left:1px solid var(--line);padding-left:12px}
.brand .bt b{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.brand .bt small{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:700}
nav.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);margin-left:auto;flex-wrap:wrap}
nav.tabs a{padding:7px 14px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
nav.tabs a[aria-current="page"]{background:var(--card2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--gold-lo)}
nav.tabs a:hover{color:var(--fg)}
.me{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 8px;border:1px solid var(--gold-lo);border-radius:999px;font-size:13px;font-weight:700;background:var(--gold-bg)}
@media (max-width:820px){nav.tabs{order:3;width:100%;margin:0;overflow-x:auto;flex-wrap:nowrap}nav.tabs a{white-space:nowrap}.me{margin-left:auto}.brand .bt small{display:none}}
.chev{flex:none;display:block}

main{padding-block:8px 72px}
.view{display:grid;gap:34px}

/* hero centralizado, igual ao Ranking */
.hero{position:relative;text-align:center;padding-block:40px 8px;display:grid;justify-items:center;gap:0;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-30% -20% auto;height:520px;background:radial-gradient(closest-side,rgba(214,172,76,.22),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 auto 24px;width:min(420px,100%)}
.logo-msp{font-family:"Krona One","Arial Black",sans-serif;font-size:clamp(54px,14vw,88px);line-height:.95;letter-spacing:.04em;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.logo-sub{font-family:"Montserrat",var(--f-body);font-weight:600;font-size:clamp(10px,2.6vw,14px);letter-spacing:.42em;text-transform:uppercase;color:#fff;padding-left:.42em}
.logo-rule{display:flex;align-items:center;gap:10px;width:100%;margin-top:6px}
.logo-rule span{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold-hi) 70%,var(--gold));border-radius:2px}
.logo-rule span:last-child{background:linear-gradient(90deg,var(--gold),var(--gold-hi) 30%,var(--gold) 70%,transparent)}
.logo-rule svg{width:22px;height:22px;flex:none;filter:drop-shadow(0 0 8px rgba(244,210,124,.5))}
.hero h1{font-size:clamp(48px,11vw,104px);line-height:.9;margin:8px 0 18px}
.periodo{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--gold-lo);border-radius:999px;padding:6px 18px;font-family:var(--f-num);font-size:14px;color:var(--gold-hi);background:var(--gold-bg)}
.upd{margin-top:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.live{width:8px;height:8px;border-radius:50%;background:var(--down);box-shadow:0 0 0 0 rgba(224,100,90,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(224,100,90,0)}100%{box-shadow:0 0 0 0 rgba(224,100,90,0)}}
.hero p.lead{max-width:62ch;color:var(--muted);margin:20px auto 0;font-size:16.5px}
.hero p.lead strong{color:var(--fg)}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;justify-content:center}
.left .ctas,.card .ctas{justify-content:flex-start}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:999px;border:0;background:none;color:var(--gold-hi);box-shadow:inset 0 0 0 1.5px var(--gold-lo);font-weight:700;text-decoration:none;min-height:44px}
.btn:hover{box-shadow:inset 0 0 0 1.5px var(--gold)}
.btn.pri{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--on-gold);box-shadow:none}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:none}
.btn.sm{padding:6px 14px;min-height:34px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* pódio com brasões */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:14px;max-width:760px;width:100%;margin:6px auto 0}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pod .shield{width:62px;height:72px;margin-bottom:8px}
.pod.p1 .shield{width:80px;height:92px}
.pod .nm{font-weight:700;font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pts{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1}
.pod.p1 .pts{font-size:58px;color:var(--gold-hi)}
.pod .pts small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.pod .meta{font-size:12px;color:var(--muted);margin-top:4px}
.pod .chips{margin-top:8px;justify-content:center}
.step{width:100%;margin-top:14px;border-radius:12px 12px 0 0;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;color:rgba(255,255,255,.9);background:linear-gradient(180deg,var(--card2),var(--bg2));border:1px solid var(--line);border-bottom:none}
.p1 .step{height:150px;font-size:96px;background:linear-gradient(180deg,#5a4519 0%,#2b2210 100%);border-color:var(--gold-lo);color:var(--gold-hi)}
.p2 .step{height:110px;font-size:72px}
.p3 .step{height:84px;font-size:60px}
.timer{margin:16px auto 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.timer .tl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.timer #cd{font-size:30px;font-weight:600;color:var(--gold-hi);letter-spacing:.06em}
.timer .tl2{font-size:12px;color:var(--gold);font-weight:600}
.ment-band{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:22px 24px;border-radius:16px;border:1px solid var(--gold-lo);background:radial-gradient(120% 140% at 0% 0%,rgba(214,172,76,.18),transparent 60%),var(--card)}
.ment-band h3{font-size:clamp(28px,4vw,40px)}
.ment-band p{margin:6px 0 0;color:var(--muted)}
@media (max-width:700px){.ment-band{grid-template-columns:1fr}}
footer a{color:var(--gold);text-decoration:none}
.wa-fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:999px;background:#25d366;color:#fff;text-decoration:none;font-weight:800;font-size:14px;box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 0 4px rgba(37,211,102,.18)}
.wa-fab svg{width:42px;height:42px;flex:none}
.wa-fab:hover{filter:brightness(1.06)}
.wa-ico{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#25d366}
.wa-ico svg{width:16px;height:16px}
@media (max-width:640px){.wa-fab{padding:8px}.wa-fab span{display:none}}
footer{padding-bottom:96px}
.largada{max-width:640px;margin:0 auto;text-align:center;padding:16px 20px;border:1px solid var(--gold-lo);border-radius:14px;background:rgba(214,172,76,.07);color:var(--muted);font-size:14px}
.largada b{color:var(--gold-hi)}
@media (max-width:560px){
  .podium{gap:8px}.pod .nm{font-size:13px}.pod .pts{font-size:32px}.pod.p1 .pts{font-size:42px}
  .pod .shield{width:46px;height:54px}.pod.p1 .shield{width:60px;height:70px}
  .p1 .step{height:110px;font-size:64px}.p2 .step{height:80px;font-size:48px}.p3 .step{height:62px;font-size:40px}
  .pod .chips .chip{width:14px;height:14px;font-size:0;border-radius:4px}.pod .chips{gap:2px}
}

/* números da operação */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:4px;align-content:start}
.pcard .v{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:1;color:var(--gold-hi)}
.pcard .t{font-weight:700}
.pcard p{margin:0;font-size:13px;color:var(--muted)}
.group{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.sect-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sect-h.c{justify-content:center;text-align:center;flex-direction:column;align-items:center}
.lead2{max-width:68ch;color:var(--muted);margin:0}
.faq{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.faq div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px}
.faq b{display:block;margin-bottom:4px;font-size:16px}
.faq p{margin:0;font-size:14px;color:var(--muted)}

/* fichas (ranking) */
.search{display:flex;justify-content:center}
.search label{position:relative;width:min(520px,100%)}
.search input{width:100%;font:inherit;color:var(--fg);background:var(--bg2);border:1.5px solid var(--gold-lo);border-radius:999px;padding:13px 18px 13px 46px;outline:none}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(214,172,76,.15)}
.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ficha{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.ficha.top10{background:linear-gradient(160deg,var(--card2),var(--card))}
.ficha.mine{border-color:var(--gold);box-shadow:0 0 0 3px rgba(214,172,76,.25)}
.ficha .pos{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;display:flex;align-items:baseline;gap:8px}
.ficha .pos sup{font-size:12px}
.ficha .pts{grid-row:span 2;align-self:center;text-align:right;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.ficha .pts small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:600}
.ficha .nm{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ficha .row{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.ficha .info{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;font-family:var(--f-num);font-style:normal}
.chip.M{background:var(--gold);color:var(--on-gold)}
.chip.E{background:rgba(214,172,76,.18);color:var(--gold-hi);box-shadow:inset 0 0 0 1px var(--gold-lo)}
.chip.X{background:transparent;color:var(--dim);box-shadow:inset 0 0 0 1px var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* painéis */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.note{padding:12px 16px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.note.warn{background:rgba(214,172,76,.07);border-color:var(--gold-lo);color:var(--fg)}
.empty{text-align:center;padding:40px 20px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--f-num);letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.pill.ok{color:var(--on-gold);background:var(--gold);box-shadow:none}
.pill.go{color:var(--gold-hi);box-shadow:inset 0 0 0 1px var(--gold-lo);background:var(--gold-bg)}

/* alistamento */
.enlist{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:760px){.enlist{grid-template-columns:1fr}}
form{display:grid;gap:14px}
label.f{display:grid;gap:6px;font-weight:700;font-size:14px}
label.f small{font-weight:500;color:var(--muted)}
input[type=text],input[type=tel],input[type=url],input[type=number],input[type=date],label.f select{width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);color:var(--fg);font:inherit;outline:none}
input:focus{border-color:var(--gold)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;font-weight:600;cursor:pointer}
.seg input,.chk input{accent-color:var(--gold)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
.chk input{margin-top:3px}
.err{color:var(--down);font-size:14px;min-height:1em}

/* missões */
.trk-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;padding-top:28px}
@media (max-width:640px){.trk-head{grid-template-columns:1fr}}
.trk-head h1,.mhead h1,.pg-h{font-size:clamp(46px,8vw,92px)}
.view>.sect-h:first-child,.view>section.sect-h{padding-top:28px}
.switch{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.switch a{padding:8px 18px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:700}
.switch a[aria-current="page"]{background:var(--card2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--gold-lo)}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mis{position:relative;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:18px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--fg);min-height:200px;overflow:hidden;transition:border-color .2s,transform .2s}
.mis:hover{border-color:var(--gold-lo);transform:translateY(-2px)}
.mis.done{background:linear-gradient(160deg,var(--card2),var(--card));border-color:var(--gold-lo)}
.mis .num{font:900 74px/.8 var(--f-display);position:absolute;right:14px;top:14px;color:transparent;-webkit-text-stroke:1px var(--line)}
.mis.done .num{-webkit-text-stroke:1px var(--gold-lo)}
.mis .d{font-size:12px;letter-spacing:.24em;font-weight:700;color:var(--gold)}
.mis h3{font-size:26px;font-weight:800;max-width:15ch;position:relative}
.mis .arts{font-size:13px;color:var(--muted)}
.mis .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mis.locked{opacity:.45;pointer-events:none}
.steps5{display:flex;gap:4px}
.steps5 i{width:16px;height:4px;border-radius:2px;background:var(--line)}
.steps5 i.on{background:var(--gold)}

.mhead{display:grid;gap:10px}
.back{font-weight:700;text-decoration:none;color:var(--muted);font-size:14px;padding-top:24px}
.stepper{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(110px,1fr));gap:6px;overflow-x:auto;padding:4px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.stepper button{display:grid;gap:3px;text-align:left;padding:10px 12px;border-radius:10px;border:0;background:none;color:var(--muted)}
.stepper button .k{font:600 11px/1 var(--f-num);letter-spacing:.1em}
.stepper button b{font-size:14px}
.stepper button[aria-selected="true"]{background:var(--card2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--gold-lo)}
.stepper button.done .k{color:var(--gold)}
.panel{display:grid;gap:16px}
.pdfbox{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.pdficon{width:74px;height:94px;border-radius:8px;background:linear-gradient(180deg,#5a4519,#2b2210);border:1px solid var(--gold-lo);display:grid;place-items:center;font:900 20px var(--f-display);color:var(--gold-hi)}
.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.brief div{padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.brief b{display:block;font:800 20px/1.05 var(--f-display);text-transform:uppercase;margin-bottom:6px;color:var(--gold-hi)}
.brief p{margin:0;font-size:14.5px}
.trap{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:16px;border-radius:14px;border:1px dashed var(--down);background:var(--down-bg)}
.trap b{font:900 22px/1 var(--f-display);text-transform:uppercase;color:var(--down)}
.trap p{margin:0}
.deck{display:grid;gap:14px;justify-items:center}
.flip{width:min(560px,100%);aspect-ratio:16/10;max-width:100%;perspective:1200px;border:0;background:none;padding:0}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fc{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:grid;place-items:center;padding:26px;text-align:center;border:1px solid var(--line)}
.flip .fr{background:linear-gradient(160deg,var(--card2),var(--card));border-color:var(--gold-lo)}
.flip .fr span{font:800 clamp(24px,3.6vw,36px)/1.05 var(--f-display);text-transform:uppercase}
.flip .bk{background:var(--bg2);transform:rotateY(180deg);font-size:17px}
.flip small{position:absolute;bottom:12px;left:0;right:0;font:600 11px var(--f-num);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.deckbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.juris{display:grid;gap:10px}
.juris div{display:grid;grid-template-columns:170px 1fr;gap:14px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.juris b{font:600 13px/1.3 var(--f-num);color:var(--gold-hi)}
@media (max-width:560px){.juris div{grid-template-columns:1fr;gap:4px}}

.brief-quiz{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media (max-width:760px){.brief-quiz{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px}
.kv b{display:block;font:900 32px/1 var(--f-display);color:var(--gold-hi)}
.kv span{font-size:12px;color:var(--muted)}
.mini{display:grid;gap:6px}
.mini div{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px}
.mini div.mine{border-color:var(--gold)}
.mini .pos{font:800 20px/1 var(--f-display);width:30px;color:var(--gold-hi)}
.mini .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}

/* prova */
.quiz{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.qtop{position:sticky;top:0;z-index:2;background:rgba(12,11,9,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.qtop .wrap{display:flex;align-items:center;gap:14px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.qtop .t{font:800 22px/1 var(--f-display);text-transform:uppercase}
.clock{margin-left:auto;font:600 28px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--gold-hi);letter-spacing:.06em}
.clock.low{color:var(--down)}
.tbar{height:3px;background:var(--line)}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transition:width 1s linear}
.qbody{padding-block:28px 40px;display:grid;gap:22px;max-width:840px}
.qno{font-size:12px;letter-spacing:.28em;font-weight:700;color:var(--gold)}
.qtext{font-size:clamp(19px,2.4vw,23px);line-height:1.5;margin:0;max-width:65ch;font-weight:500}
.texto{padding:18px 20px;border-left:3px solid var(--gold);background:var(--bg2);border-radius:0 14px 14px 0;font-size:16px;line-height:1.7;max-width:72ch;white-space:pre-line;color:#e6dcc6}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans button{padding:18px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font:900 28px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.ans button kbd{font:500 11px var(--f-num);color:var(--dim);margin-left:8px;vertical-align:middle}
.ans button.c[aria-pressed="true"]{border-color:var(--up);background:var(--up-bg);color:var(--up)}
.ans button.e[aria-pressed="true"]{border-color:var(--down);background:var(--down-bg);color:var(--down)}
.opts{display:grid;gap:8px}
.opts button{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:16px;line-height:1.45}
.opts button .l{font:900 20px/1 var(--f-display);width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--card2);color:var(--gold-hi)}
.opts button[aria-pressed="true"]{border-color:var(--gold);background:rgba(214,172,76,.08)}
.opts button[aria-pressed="true"] .l{background:var(--gold);color:var(--on-gold)}
.qnav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.sheet button{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--card);font:600 12px var(--f-num);color:var(--muted)}
.sheet button.cur{outline:2px solid var(--gold);outline-offset:1px}
.sheet button[data-v]:not([data-v=""]){background:rgba(214,172,76,.14);color:var(--gold-hi);border-color:var(--gold-lo)}
.sheet button[data-v="C"]{background:var(--up-bg);color:var(--up);border-color:rgba(95,207,138,.45)}
.sheet button[data-v="E"]{background:var(--down-bg);color:var(--down);border-color:rgba(224,100,90,.45)}
.sheet-lbl{font-size:11px;letter-spacing:.24em;font-weight:700;color:var(--muted);text-transform:uppercase}

/* resultado */
.result{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:820px){.result{grid-template-columns:1fr}}
.score{display:grid;gap:12px}
.score .big{font:900 clamp(84px,14vw,148px)/.82 var(--f-display)}
.score .big small{font-size:.35em;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.trio div{padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.trio b{display:block;font:900 26px/1 var(--f-display)}
.trio span{font-size:12px;color:var(--muted)}
.mc{position:relative;padding:24px;border-radius:18px;background:radial-gradient(120% 90% at 50% 0%,rgba(214,172,76,.22),transparent 60%),linear-gradient(180deg,#1d1810,#0c0b09);border:1px solid var(--gold-lo);overflow:hidden;display:grid;gap:10px;justify-items:center;text-align:center}
.mc .mlogo{font-family:"Krona One","Arial Black",sans-serif;font-size:30px;color:#fff;letter-spacing:.04em;line-height:1}
.mc .mrule{width:140px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold-hi),var(--gold),transparent)}
.mc .tag{font-size:11px;letter-spacing:.28em;font-weight:700;color:var(--gold);text-transform:uppercase}
.mc h3{font-size:46px}
.mc .who{font:800 26px/1 var(--f-display);text-transform:uppercase;color:#fff}
.mc .ln{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.mc .ln b{display:block;font:900 34px/1 var(--f-display);color:var(--gold-hi);letter-spacing:0}
.mc .sub{font:500 12px var(--f-num);color:var(--muted)}
.rev{display:grid;gap:8px}
.rev>div{display:grid;grid-template-columns:42px 1fr auto;gap:12px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);align-items:start}
.rev .i{font:600 13px var(--f-num);color:var(--dim)}
.rev p{margin:0}
.rev .cm{font-size:13.5px;color:var(--muted);margin-top:6px}
.rev .op{font-size:13.5px;margin-top:4px;color:var(--muted)}
.rev .op.g{color:var(--up);font-weight:700}
.rev .op.x{color:var(--down);text-decoration:line-through}
.rev .g{font:900 16px/1 var(--f-display);padding:6px 9px;border-radius:8px;text-transform:uppercase;white-space:nowrap}
.rev .g.ok{background:var(--up-bg);color:var(--up)}
.rev .g.bad{background:var(--down-bg);color:var(--down)}
.rev .g.bl{background:var(--card2);color:var(--muted)}

/* ranking, tabelas */
.rk-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
select{padding:10px 16px;border-radius:999px;border:1.5px solid var(--gold-lo);background:var(--bg2);color:var(--fg);font:inherit;font-weight:600}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td.pos{font:800 22px/1 var(--f-display);width:56px}
tr.top1 td.pos{color:var(--gold-hi)}
tr.mine{background:rgba(214,172,76,.08)}
.who{display:flex;align-items:center;gap:10px}
.who small{color:var(--muted)}
textarea{width:100%;min-height:280px;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);color:var(--fg);font:14px/1.6 var(--f-num);resize:vertical}

/* arena, mentoria, comando */
.arena{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.ar{display:grid;gap:12px;padding:22px;border-radius:16px;border:1px solid var(--line);background:var(--card);align-content:start}
.ar h3{font-size:34px}
.ar ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.ment{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;padding-top:28px}
@media (max-width:820px){.ment{grid-template-columns:1fr}}
.ladder{display:grid;border-left:2px solid var(--gold-lo);margin-left:8px}
.ladder div{position:relative;padding:0 0 22px 22px}
.ladder div::before{content:"";position:absolute;left:-8px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.ladder b{display:block;font:800 22px/1.1 var(--f-display);text-transform:uppercase}
.ladder p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.cmp{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cmp>div{padding:18px;display:grid;gap:8px;align-content:start;background:var(--card)}
.cmp>div:last-child{background:linear-gradient(180deg,#3a2d12,#1d1810)}
.cmp h3{font-size:24px}
.cmp ul{margin:0;padding-left:18px;font-size:14px}
@media (max-width:520px){.cmp{grid-template-columns:1fr}}
.adm{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.stepn{display:flex;align-items:center;gap:8px}
.stepn b{font:900 36px/1 var(--f-display);min-width:46px;text-align:center;color:var(--gold-hi)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--on-gold);padding:10px 18px;border-radius:999px;font-weight:700;z-index:80;max-width:calc(100% - 32px)}
footer{border-top:1px solid var(--line);padding-block:24px;text-align:center;font-size:12px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
